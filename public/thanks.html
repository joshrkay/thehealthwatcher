<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F4C5C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Thank You | The Health Watchers</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f7faf9;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        max-width: 680px;
        border: 1px solid #dbe5e3;
        border-radius: 32px;
        background: #ffffff;
        padding: 40px;
        box-shadow: 0 24px 80px rgba(15, 76, 92, 0.12);
      }

      img {
        width: 260px;
        max-width: 100%;
        height: auto;
        margin-bottom: 32px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #0f766e;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #0f172a;
        font-size: clamp(36px, 6vw, 56px);
        line-height: 1;
        letter-spacing: -0.055em;
      }

      p {
        margin: 20px 0 0;
        color: #475569;
        font-size: 18px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 28px;
        border-radius: 999px;
        background: #0f4c5c;
        padding: 14px 22px;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.svg" alt="The Health Watchers" />
      <p class="eyebrow">Inquiry Received</p>
      <h1>Thank you for reaching out.</h1>
      <p>
        Your message has been sent to The Health Watchers team. We’ll review your inquiry and follow up with you directly.
      </p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
