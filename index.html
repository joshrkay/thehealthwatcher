<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F4C5C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>The Health Watchers | Population Health In-Home Medical Care</title>
    <meta
      name="description"
      content="The Health Watchers provides population health in-home medical visits, telemedicine support, senior living medical care, care gap closure, and clinical coordination for high-needs patients."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function configureHealthWatchersContactForm() {
        const form = document.querySelector('form[aria-label="Partnership inquiry form"]');

        if (!form) {
          window.setTimeout(configureHealthWatchersContactForm, 250);
          return;
        }

        form.setAttribute('action', 'https://formsubmit.co/skay@thehealthwatchers.com');
        form.setAttribute('method', 'POST');
        form.setAttribute('accept-charset', 'UTF-8');

        const hiddenFields = {
          _subject: 'New partnership inquiry from The Health Watchers website',
          _template: 'table',
          _captcha: 'false',
          _next: 'https://thehealthwatchers.com/thanks.html',
          source: 'The Health Watchers Website',
        };

        Object.entries(hiddenFields).forEach(([name, value]) => {
          let input = form.querySelector(`input[name="${name}"]`);
          if (!input) {
            input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            form.appendChild(input);
          }
          input.value = value;
        });

        let honeypot = form.querySelector('input[name="_honey"]');
        if (!honeypot) {
          honeypot = document.createElement('input');
          honeypot.type = 'text';
          honeypot.name = '_honey';
          honeypot.tabIndex = -1;
          honeypot.autocomplete = 'off';
          honeypot.style.display = 'none';
          form.appendChild(honeypot);
        }

        const submitButton = form.querySelector('button');
        if (submitButton) {
          submitButton.type = 'submit';
        }
      }

      configureHealthWatchersContactForm();
    </script>
  </body>
</html>
